<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Page Not Found – DigiIndia Platform</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/Icon.svg">
    <link rel="shortcut icon" href="/Icon.svg">

    <!-- Primary SEO Meta Tags -->
    <meta name="title" content="404 Page Not Found – DigiIndia Platform">
    <meta name="robots" content="noindex, follow">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">

</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-center align-items-center p-3">

    <div class="container max-w-700 text-center">
        <div class="card glass-card p-4 p-md-5 border-0 shadow-lg rounded-4">
            <div class="display-1 fw-bold text-primary mb-2">404</div>
            <h3 class="fw-bold text-dark mb-3">Resource or Page Not Found</h3>
            <p class="text-muted mb-4" id="notFoundUrlText">The requested URL <code id="brokenUrlPath" class="text-danger"></code> was not found on the DigiIndia server.</p>

            <!-- Dynamic Smart Suggestions Container -->
            <div id="smartSuggestionsBox" class="alert alert-primary border-primary-subtle text-start p-3 mb-4 rounded-3 d-none">
                <h6 class="fw-bold text-primary mb-2"><i class="bi bi-lightbulb-fill me-2"></i>Smart AI URL Suggestion</h6>
                <div id="suggestionLinks" class="d-flex flex-wrap gap-2"></div>
            </div>

            <!-- Quick Search Bar -->
            <form action="/search.html" method="GET" class="mb-4">
                <div class="input-group input-group-lg shadow-sm rounded-pill overflow-hidden border">
                    <input type="text" name="q" id="smartSearchQuery" class="form-control border-0 px-4" placeholder="Search projects, SPN profiles, or tech stacks...">
                    <button type="submit" class="btn btn-primary px-4"><i class="bi bi-search me-1"></i>Search</button>
                </div>
            </form>

            <div class="d-flex flex-wrap justify-content-center gap-2 pt-2 border-top">
                <a href="/" class="btn btn-primary px-3 rounded-pill"><i class="bi bi-house-fill me-1"></i>Home</a>
                <a href="/search.html" class="btn btn-outline-primary px-3 rounded-pill"><i class="bi bi-search me-1"></i>Search Engine</a>
                <a href="/dashboard.html" class="btn btn-outline-secondary px-3 rounded-pill"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
                <a href="/index.html" class="btn btn-outline-dark px-3 rounded-pill"><i class="bi bi-box-arrow-in-right me-1"></i>Login Modal</a>
            </div>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const currentPath = window.location.pathname.toLowerCase();
            const currentUrl = window.location.href.toLowerCase();
            document.getElementById("brokenUrlPath").innerText = window.location.pathname + window.location.search;

            const suggestionsBox = document.getElementById("smartSuggestionsBox");
            const linksContainer = document.getElementById("suggestionLinks");
            const searchInput = document.getElementById("smartSearchQuery");

            let links = [];
            let extractedQuery = "";

            if (currentPath.includes("login") || currentPath.includes("auth")) {
                links.push({ title: "Student / Admin Login", url: "/index.html" });
                links.push({ title: "Create New Account", url: "/CreateAccount.html" });
            } else if (currentPath.includes("profile") || currentUrl.includes("spn")) {
                links.push({ title: "Browse Student Directory", url: "/search.html?tab=students" });
                links.push({ title: "My Dashboard Profile", url: "/dashboard.html" });
                const spnMatch = currentUrl.match(/spn[=/](\d{8})/);
                if (spnMatch) extractedQuery = spnMatch[1];
            } else if (currentPath.includes("project") || currentUrl.includes("id")) {
                links.push({ title: "Explore Public Projects", url: "/search.html?tab=projects" });
                links.push({ title: "Submit New Project", url: "/dashboard.html" });
            } else if (currentPath.includes("admin")) {
                links.push({ title: "Admin Portal", url: "/Admin.html" });
            }

            if (extractedQuery) {
                searchInput.value = extractedQuery;
            } else {
                const parts = currentPath.split("/").filter(p => p && p !== "api" && p !== "v1");
                if (parts.length) searchInput.value = parts[parts.length - 1].replace(/[-_.]/g, " ");
            }

            if (links.length) {
                linksContainer.innerHTML = links.map(l => `
                    <a href="${l.url}" class="btn btn-sm btn-light border text-primary fw-semibold"><i class="bi bi-arrow-right-circle me-1"></i>${l.title}</a>
                `).join("");
                suggestionsBox.classList.remove("d-none");
            }
        });
    </script>
</body>
</html>
