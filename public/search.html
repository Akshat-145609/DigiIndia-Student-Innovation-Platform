<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DigiIndia Search Engine – Public Developer Discovery</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/Icon.svg">
    <link rel="shortcut icon" href="/Icon.svg">

    <!-- Primary SEO Meta Tags -->
    <meta name="title" content="DigiIndia Search Engine – Public Developer Discovery">
    <meta name="description" content="Search verified student innovation projects, SPN student profiles, live Google SERP, YouTube tutorials, and multi-lingual tech stacks across India.">
    <meta name="keywords" content="DigiIndia Search, Student Developer Directory, Open Source Projects India, SPN Lookup, Code Ownership Index">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://digiindia-studentcollaboration.web.app/search.html">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://digiindia-studentcollaboration.web.app/search.html">
    <meta property="og:title" content="DigiIndia Search Engine – Public Developer Discovery">
    <meta property="og:description" content="Discover verified student innovation projects, SPN student profiles, and developer repositories.">
    <meta property="og:image" content="https://digiindia-studentcollaboration.web.app/Icon.svg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://digiindia-studentcollaboration.web.app/search.html">
    <meta property="twitter:title" content="DigiIndia Search Engine – Public Developer Discovery">
    <meta property="twitter:description" content="Discover verified student innovation projects, SPN student profiles, and developer repositories.">
    <meta property="twitter:image" content="https://digiindia-studentcollaboration.web.app/Icon.svg">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">

    <style>
        :root {
            --primary-blue: #1a73e8;
            --serp-blue: #1a0dab;
            --text-main: #202124;
            --text-muted: #5f6368;
            --surface-card: #ffffff;
            --border-subtle: #dfe1e5;
        }

        body {
            background-color: #ffffff;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        /* STRICT SINGLE-LINE INLINE HEADER ACROSS ALL MEDIA */
        .search-header-nav {
            background: #ffffff;
            border-bottom: 1px solid #ebebeb;
            padding: 8px 16px;
            position: sticky;
            top: 0;
            z-index: 1050;
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: nowrap !important;
            width: 100%;
            gap: 8px;
        }

        .brand-logo-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: var(--primary-blue);
            font-weight: 700;
            font-size: 18px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .header-actions {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-wrap: nowrap !important;
            flex-shrink: 0;
        }

        .header-btn {
            padding: 4px 12px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 9999px;
            white-space: nowrap;
            text-decoration: none;
        }

        /* VIEW 1: GOOGLE-STYLE LANDING VIEW */
        #landingView {
            min-height: calc(100vh - 70px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 16px 80px;
        }

        .landing-hero-logo {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #202124;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .landing-search-container {
            width: 100%;
            max-width: 620px;
            position: relative;
            margin: 0 auto;
        }

        .home-search-capsule {
            background: #ffffff;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
            display: flex;
            align-items: center;
            padding: 2px 14px;
            transition: all 0.2s ease;
            position: relative;
            z-index: 20;
        }

        .home-search-capsule:hover {
            box-shadow: 0 2px 8px rgba(32, 33, 36, 0.35);
        }

        .home-search-capsule.open {
            border-bottom-left-radius: 0 !important;
            border-bottom-right-radius: 0 !important;
            border-bottom-color: transparent !important;
            box-shadow: 0 4px 12px rgba(32, 33, 36, 0.28) !important;
        }

        .home-search-input {
            border: none;
            outline: none;
            font-size: 16px;
            width: 100%;
            padding: 10px 8px;
            color: #202124;
            background: transparent;
        }

        /* ATTACHED GOOGLE-STYLE AUTOCOMPLETE DROPDOWN */
        .home-suggestions-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: #ffffff;
            border: 1px solid #dfe1e5;
            border-top: none;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            box-shadow: 0 4px 12px rgba(32, 33, 36, 0.28);
            z-index: 19;
            overflow: hidden;
            margin-top: -1px;
            padding-bottom: 8px;
        }

        .suggestion-row {
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: #202124;
            cursor: pointer;
            transition: background 0.12s ease;
            text-align: left;
        }

        .suggestion-row:hover {
            background-color: #f1f3f4;
        }

        .tag-pill {
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
        }
        .tag-pill:hover {
            background-color: #f1f3f4 !important;
            color: var(--primary-blue) !important;
        }

        /* VIEW 2: SEPARATE SPA GOOGLE SERP VIEW */
        #serpView {
            min-height: calc(100vh - 70px);
            background-color: #ffffff;
        }

        .serp-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 16px 16px 60px;
        }

        /* In-SERP Header Search Capsule */
        .serp-top-capsule {
            background: #ffffff;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            box-shadow: 0 1px 4px rgba(32, 33, 36, 0.18);
            display: flex;
            align-items: center;
            padding: 2px 10px;
            width: 100%;
        }

        .serp-top-input {
            border: none;
            outline: none;
            font-size: 15px;
            width: 100%;
            padding: 6px 8px;
            background: transparent;
        }

        /* Google SERP Tab Bar */
        .serp-tab-bar {
            display: flex;
            gap: 8px;
            border-bottom: 1px solid #ebebeb;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 2px;
            margin-bottom: 14px;
        }
        .serp-tab-bar::-webkit-scrollbar {
            display: none;
        }

        .serp-tab-btn {
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: 500;
            color: #5f6368;
            cursor: pointer;
            transition: all 0.12s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .serp-tab-btn:hover {
            color: #202124;
        }

        .serp-tab-btn.active {
            color: #1a73e8;
            font-weight: 600;
            border-bottom-color: #1a73e8;
        }

        /* Authentic Google SERP Result Item */
        .google-serp-item {
            margin-bottom: 24px;
            text-align: left;
        }

        .serp-site-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 3px;
        }

        .serp-favicon {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #f1f3f4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
        }

        .serp-url-breadcrumb {
            font-size: 12px;
            color: #4d5156;
            line-height: 1.2;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .serp-headline a {
            color: #1a0dab;
            font-size: 20px;
            font-weight: 500;
            line-height: 1.3;
            text-decoration: none;
            display: inline-block;
        }

        .serp-headline a:hover {
            text-decoration: underline !important;
        }

        .serp-snippet {
            color: #4d5156;
            font-size: 14px;
            line-height: 1.58;
            margin-top: 4px;
            margin-bottom: 8px;
        }

        .serp-sitelinks-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 6px;
        }

        .serp-sublink-chip {
            font-size: 12px;
            font-weight: 500;
            color: #1a73e8;
            background: #f8f9fa;
            border: 1px solid #dadce0;
            border-radius: 16px;
            padding: 2px 10px;
            text-decoration: none;
            transition: background 0.15s ease;
        }

        .serp-sublink-chip:hover {
            background: #e8f0fe;
            color: #1a73e8;
        }

        /* YouTube Video SERP Card */
        .yt-serp-card {
            background: #ffffff;
            border: 1px solid #dfe1e5;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 20px;
            text-align: left;
        }

        .yt-thumb-box {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            background: #000000;
        }

        .yt-thumb-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .yt-duration-pill {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 4px;
        }

        .yt-play-btn-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: rgba(220, 38, 38, 0.9);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* Grid for Projects and Students */
        .serp-entity-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .serp-entity-card {
            background: #ffffff;
            border: 1px solid #dfe1e5;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: left;
        }

        .serp-entity-card:hover {
            border-color: #bdc1c6;
            box-shadow: 0 1px 6px rgba(32,33,36,0.1);
        }

        /* Mobile Adjustments */
        @media (max-width: 576px) {
            .landing-hero-logo {
                font-size: 32px;
            }
            .brand-logo-link span {
                font-size: 16px;
            }
            .serp-headline a {
                font-size: 17px;
            }
            .serp-entity-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- STRICT INLINE HEADER NAVBAR -->
    <nav class="search-header-nav">
        <div class="header-inner">
            <!-- Brand Logo -->
            <a class="brand-logo-link" href="/search.html" onclick="switchToLandingView(event)">
                <i class="bi bi-search-heart text-primary"></i>
                <span>DigiIndia</span>
            </a>

            <!-- Header Search Capsule (Visible only in SERP view on larger screens) -->
            <div id="serpHeaderNavCapsule" class="d-none flex-grow-1 mx-2" style="max-width: 560px;">
                <div class="serp-top-capsule position-relative">
                    <i class="bi bi-search text-muted ms-2 me-2"></i>
                    <input 
                        type="text" 
                        id="serpTopInput" 
                        class="serp-top-input" 
                        placeholder="Search projects, developers, tech stacks..." 
                        autocomplete="off"
                        oninput="handleSerpTopInput(this.value)"
                        onkeyup="if(event.key==='Enter') executeSerpSearch(this.value)"
                    >
                    <button class="btn btn-link text-muted p-0 me-2" onclick="clearSearchInput()" title="Clear">
                        <i class="bi bi-x-circle-fill"></i>
                    </button>
                    <button class="btn btn-link text-danger p-0 me-1" onclick="startVoiceSearch('serp')" title="Voice">
                        <i class="bi bi-mic-fill" id="serpMicIcon"></i>
                    </button>
                </div>
            </div>

            <!-- Action Buttons: Strictly Inline -->
            <div class="header-actions">
                <a href="/index.html" class="btn btn-outline-secondary header-btn"><i class="bi bi-house me-1"></i>Home</a>
                <a href="/dashboard.html" class="btn btn-primary header-btn text-white"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
            </div>
        </div>
    </nav>

    <!-- ========================================== -->
    <!-- VIEW 1: GOOGLE SEARCH HOME LANDING VIEW     -->
    <!-- ========================================== -->
    <div id="landingView">
        <div class="text-center w-100" style="max-width: 650px;">
            
            <div class="landing-hero-logo">
                <i class="bi bi-search-heart text-primary"></i>
                <span>DigiIndia</span>
            </div>
            <p class="text-muted small mb-4">India's Verified Student Innovation & Developer Platform</p>

            <!-- Centered Search Capsule with Attached Dropdown -->
            <div class="landing-search-container mb-3">
                <div id="homeCapsule" class="home-search-capsule">
                    <i class="bi bi-search text-muted ms-2 me-2 fs-5"></i>
                    <input 
                        type="text" 
                        id="homeSearchInput" 
                        class="home-search-input" 
                        placeholder="Search projects, developers, tech stacks..." 
                        autocomplete="off"
                        oninput="handleHomeInput(this.value)" 
                        onkeyup="if(event.key==='Enter') triggerSearchFromHome(this.value)"
                    >
                    <button class="btn btn-link text-danger fs-5 p-0 me-1" onclick="startVoiceSearch('home')" title="Voice Search">
                        <i class="bi bi-mic-fill" id="homeMicIcon"></i>
                    </button>
                </div>

                <!-- Attached Suggestions Dropdown as Google -->
                <div id="homeSuggestionsDropdown" class="home-suggestions-dropdown d-none"></div>
            </div>

            <!-- Google-Style Action Buttons -->
            <div class="d-flex justify-content-center gap-2 mb-4">
                <button class="btn btn-light border px-4 py-2 small fw-medium" onclick="triggerSearchFromHome(document.getElementById('homeSearchInput').value)">
                    DigiIndia Search
                </button>
                <button class="btn btn-light border px-4 py-2 small fw-medium" onclick="feelingLucky()">
                    I'm Feeling Lucky
                </button>
            </div>

            <!-- Trending Quick Tags -->
            <div class="d-flex justify-content-center flex-wrap gap-2">
                <span class="small text-muted me-1 align-self-center">Trending:</span>
                <span class="badge bg-light text-secondary border rounded-pill px-3 py-2 tag-pill" onclick="quickTag('Machine Learning')">Machine Learning</span>
                <span class="badge bg-light text-secondary border rounded-pill px-3 py-2 tag-pill" onclick="quickTag('Full Stack React')">Full Stack React</span>
                <span class="badge bg-light text-secondary border rounded-pill px-3 py-2 tag-pill" onclick="quickTag('Python')">Python</span>
                <span class="badge bg-light text-secondary border rounded-pill px-3 py-2 tag-pill" onclick="quickTag('FastAPI')">FastAPI</span>
                <span class="badge bg-light text-secondary border rounded-pill px-3 py-2 tag-pill" onclick="quickTag('Artificial Intelligence')">AI & Deep Learning</span>
            </div>

        </div>
    </div>

    <!-- ========================================== -->
    <!-- VIEW 2: GOOGLE SERP SPA INTERFACE          -->
    <!-- ========================================== -->
    <div id="serpView" class="d-none">
        
        <!-- Mobile Search Input (Visible only on < 768px in SERP view) -->
        <div class="d-block d-md-none p-2 border-bottom bg-white">
            <div class="serp-top-capsule">
                <i class="bi bi-search text-muted ms-2 me-2"></i>
                <input 
                    type="text" 
                    id="serpMobileInput" 
                    class="serp-top-input" 
                    placeholder="Search projects, developers, tech stacks..." 
                    autocomplete="off"
                    onkeyup="if(event.key==='Enter') executeSerpSearch(this.value)"
                >
                <button class="btn btn-link text-primary p-0 me-2" onclick="executeSerpSearch(document.getElementById('serpMobileInput').value)">
                    <i class="bi bi-arrow-right-circle-fill fs-5"></i>
                </button>
            </div>
        </div>

        <div class="serp-container">

            <!-- Google-Style Category Navigation Tabs -->
            <div class="serp-tab-bar">
                <button class="serp-tab-btn active" onclick="setSerpCategory('all', this)">
                    <i class="bi bi-grid-fill"></i>All Results
                </button>
                <button class="serp-tab-btn" onclick="setSerpCategory('google', this)">
                    <i class="bi bi-google text-primary"></i>Google Web
                </button>
                <button class="serp-tab-btn" onclick="setSerpCategory('youtube', this)">
                    <i class="bi bi-youtube text-danger"></i>YouTube Videos
                </button>
                <button class="serp-tab-btn" onclick="setSerpCategory('projects', this)">
                    <i class="bi bi-code-slash text-success"></i>Projects
                </button>
                <button class="serp-tab-btn" onclick="setSerpCategory('students', this)">
                    <i class="bi bi-people text-info"></i>Innovators
                </button>
                <button class="serp-tab-btn" onclick="setSerpCategory('github', this)">
                    <i class="bi bi-github text-dark"></i>GitHub Repos
                </button>
                <button class="serp-tab-btn" onclick="setSerpCategory('semantic', this)">
                    <i class="bi bi-cpu text-purple"></i>Semantic RAG
                </button>
                <button class="serp-tab-btn ms-auto text-primary" onclick="triggerDigiBot()">
                    <i class="bi bi-robot"></i>Run DigiBot
                </button>
            </div>

            <!-- Stats Bar -->
            <div class="d-flex justify-content-between align-items-center mb-3 text-muted small">
                <span id="serpStatsText">About 75 results</span>
                <div class="d-flex align-items-center gap-2">
                    <span>Sort:</span>
                    <select id="serpSortSelect" class="form-select form-select-sm py-0 border-0 bg-transparent text-secondary fw-medium" style="width: auto;" onchange="executeSerpSearch()">
                        <option value="relevance">Relevance</option>
                        <option value="trust_score">Trust Score</option>
                        <option value="stars">Stars</option>
                        <option value="date">Date</option>
                    </select>
                </div>
            </div>

            <!-- AI Overview Card -->
            <div id="serpAiOverviewCard" class="card border-0 mb-4 p-3 rounded-4 shadow-sm d-none" style="background: linear-gradient(135deg, rgba(26,115,232,0.06), rgba(102,16,242,0.06)); border-left: 4px solid #1a73e8 !important;">
                <div class="d-flex align-items-center gap-2 mb-2">
                    <span class="badge bg-primary text-white rounded-pill px-3 py-1"><i class="bi bi-stars me-1"></i>AI Overview</span>
                    <span class="small text-muted">Synthesized developer answer</span>
                </div>
                <p id="serpAiOverviewText" class="mb-0 text-dark small lh-base" style="white-space: pre-wrap;"></p>
            </div>

            <!-- Dynamic SERP Results Container -->
            <div id="serpResultsContainer">
                <div class="text-center py-5 text-muted">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 small">Loading live search results...</p>
                </div>

        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="position-fixed bottom-0 end-0 p-3" style="z-index: 1090;"></div>

    <!-- SCRIPT DEPENDENCIES (IN STRICT SAFE ORDER) -->
    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/network.js"></script>

    <script>
        let currentSearchQuery = "";
        let currentSerpCategory = "all";
        let homeDebounceTimer = null;

        // SPA Navigation: Switch to Landing View
        function switchToLandingView(e) {
            if (e) e.preventDefault();
            document.getElementById("serpView").classList.add("d-none");
            document.getElementById("serpHeaderNavCapsule").classList.add("d-none");
            document.getElementById("landingView").classList.remove("d-none");
            window.history.pushState({}, "", "/search.html");
        }

        // SPA Navigation: Switch to SERP View
        function switchToSerpView(query) {
            currentSearchQuery = (query || "").trim();
            document.getElementById("landingView").classList.add("d-none");
            document.getElementById("serpView").classList.remove("d-none");
            document.getElementById("serpHeaderNavCapsule").classList.remove("d-none");

            document.getElementById("serpTopInput").value = currentSearchQuery;
            document.getElementById("serpMobileInput").value = currentSearchQuery;

            window.history.pushState({}, "", `/search.html?q=${encodeURIComponent(currentSearchQuery)}`);
            executeSerpSearch(currentSearchQuery);
        }

        // Home View Input Handler: Shows attached suggestions dropdown
        async function handleHomeInput(val) {
            clearTimeout(homeDebounceTimer);
            const dropdown = document.getElementById("homeSuggestionsDropdown");
            const capsule = document.getElementById("homeCapsule");

            if (!val || val.trim().length < 2) {
                dropdown.classList.add("d-none");
                capsule.classList.remove("open");
                return;
            }

            homeDebounceTimer = setTimeout(async () => {
                try {
                    const res = await API.request(`/search/autocomplete?q=${encodeURIComponent(val.trim())}`);
                    const suggestions = res.suggestions || [];
                    if (!suggestions.length) {
                        dropdown.classList.add("d-none");
                        capsule.classList.remove("open");
                        return;
                    }

                    dropdown.innerHTML = suggestions.map(s => `
                        <div class="suggestion-row" onclick="selectSuggestion('${s.replace(/'/g, "\\'")}')">
                            <i class="bi bi-search text-muted"></i>
                            <span>${stripHtmlAndSanitize(s)}</span>
                        </div>
                    `).join("");

                    capsule.classList.add("open");
                    dropdown.classList.remove("d-none");
                } catch(e) {
                    dropdown.classList.add("d-none");
                    capsule.classList.remove("open");
                }
            }, 180);
        }

        function selectSuggestion(val) {
            document.getElementById("homeSearchInput").value = val;
            document.getElementById("homeSuggestionsDropdown").classList.add("d-none");
            document.getElementById("homeCapsule").classList.remove("open");
            switchToSerpView(val);
        }

        function triggerSearchFromHome(val) {
            document.getElementById("homeSuggestionsDropdown").classList.add("d-none");
            document.getElementById("homeCapsule").classList.remove("open");
            switchToSerpView(val || "Student Innovation");
        }

        function feelingLucky() {
            const luckyTerms = ["Machine Learning", "FastAPI Python", "React Innovators", "AI Robotics", "Blockchain Identity"];
            const randomTerm = luckyTerms[Math.floor(Math.random() * luckyTerms.length)];
            switchToSerpView(randomTerm);
        }

        function quickTag(tag) {
            switchToSerpView(tag);
        }

        function clearSearchInput() {
            document.getElementById("serpTopInput").value = "";
            document.getElementById("serpMobileInput").value = "";
            switchToLandingView();
        }

        function setSerpCategory(cat, btn) {
            currentSerpCategory = cat;
            document.querySelectorAll(".serp-tab-bar .serp-tab-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            executeSerpSearch(currentSearchQuery);
        }

        // Voice Search Support
        function startVoiceSearch(origin) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                API.showToast("Web Speech API is not supported in this browser. Please use Chrome or Edge.", "warning");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = "en-US";
            recognition.interimResults = false;

            const iconId = origin === 'home' ? 'homeMicIcon' : 'serpMicIcon';
            const micIcon = document.getElementById(iconId);
            if (micIcon) micIcon.classList.add("spinner-grow", "spinner-grow-sm");

            API.showToast("Listening... Speak your query", "info");

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                if (micIcon) micIcon.classList.remove("spinner-grow", "spinner-grow-sm");
                API.showToast(`Voice query: "${transcript}"`, "success");
                switchToSerpView(transcript);
            };

            recognition.onerror = (event) => {
                if (micIcon) micIcon.classList.remove("spinner-grow", "spinner-grow-sm");
                API.showToast(`Voice recognition error: ${event.error}`, "error");
            };

            recognition.start();
        }

        // Close autocomplete when clicking outside
        document.addEventListener("click", (e) => {
            const container = document.querySelector(".landing-search-container");
            if (container && !container.contains(e.target)) {
                document.getElementById("homeSuggestionsDropdown")?.classList.add("d-none");
                document.getElementById("homeCapsule")?.classList.remove("open");
            }
        });

        function stripHtmlAndSanitize(str) {
            if (!str) return "";
            let clean = String(str).replace(/<[^>]*>?/gm, '');
            clean = clean.replace(/\{%[\s\S]*?%\}/g, '');
            clean = clean.replace(/\{\{[\s\S]*?\}\}/g, '');
            clean = clean.replace(/[#*`_~]/g, '');
            clean = clean.replace(/\s+/g, ' ').trim();
            return clean;
        }

        // Execute SERP Query
        async function executeSerpSearch(overrideQuery) {
            const query = (typeof overrideQuery === 'string' ? overrideQuery : document.getElementById("serpTopInput").value || "").trim();
            currentSearchQuery = query;
            const sortBy = document.getElementById("serpSortSelect")?.value || "relevance";
            const container = document.getElementById("serpResultsContainer");

            container.innerHTML = `
                <div class="text-center py-5 text-muted">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 small">Fetching live search results for "${query}"...</p>
                </div>
            `;

            // Request AI Overview
            if (query.length >= 3) {
                API.request(`/ai/assistant`, {
                    method: "POST",
                    body: JSON.stringify({ prompt: `Provide a concise 2-sentence developer AI overview for query: ${query}` })
                }).then(res => {
                    if (res && res.reply) {
                        document.getElementById("serpAiOverviewText").innerText = stripHtmlAndSanitize(res.reply);
                        document.getElementById("serpAiOverviewCard").classList.remove("d-none");
                    }
                }).catch(() => {});
            } else {
                document.getElementById("serpAiOverviewCard").classList.add("d-none");
            }

            try {
                let html = "";

                // 1. Google Web Tab
                if (currentSerpCategory === "google") {
                    const globalRes = await API.request(`/search/global-live?q=${encodeURIComponent(query)}`);
                    const gResults = globalRes.googleWebResults || [];
                    document.getElementById("serpStatsText").innerText = `About ${gResults.length} web results retrieved live from Google Search`;
                    html = gResults.map(w => renderGoogleSERPItem(w, query)).join("");
                    container.innerHTML = html || `<div class="text-center py-5 text-muted">No web results found.</div>`;
                    return;
                }

                // 2. YouTube Tab
                if (currentSerpCategory === "youtube") {
                    const globalRes = await API.request(`/search/global-live?q=${encodeURIComponent(query)}`);
                    const ytResults = globalRes.youtubeResources || [];
                    document.getElementById("serpStatsText").innerText = `About ${ytResults.length} video demonstrations retrieved live from YouTube`;
                    html = ytResults.map(y => renderYouTubeSERPItem(y, query)).join("");
                    container.innerHTML = html || `<div class="text-center py-5 text-muted">No videos found.</div>`;
                    return;
                }

                // 3. GitHub Repos Tab
                if (currentSerpCategory === "github") {
                    const globalRes = await API.request(`/search/global-live?q=${encodeURIComponent(query)}`);
                    const repos = globalRes.githubRepositories || [];
                    document.getElementById("serpStatsText").innerText = `About ${repos.length} live public repositories from GitHub`;
                    html = `<div class="serp-entity-grid">${repos.map(r => renderGitHubRepoCard(r)).join("")}</div>`;
                    container.innerHTML = html;
                    return;
                }

                // 4. Projects Tab
                if (currentSerpCategory === "projects") {
                    const projects = await API.request(`/search/projects?q=${encodeURIComponent(query)}&sort_by=${sortBy}`);
                    document.getElementById("serpStatsText").innerText = `About ${projects.length} verified projects found`;
                    html = `<div class="serp-entity-grid">${projects.map(p => renderProjectCard(p)).join("")}</div>`;
                    container.innerHTML = projects.length ? html : `<div class="text-center py-5 text-muted">No student projects found matching "${query}".</div>`;
                    return;
                }

                // 5. Innovators Tab
                if (currentSerpCategory === "students") {
                    const students = await API.request(`/search/students?q=${encodeURIComponent(query)}`);
                    document.getElementById("serpStatsText").innerText = `About ${students.length} verified student innovators found`;
                    html = `<div class="serp-entity-grid">${students.map(s => renderStudentCard(s)).join("")}</div>`;
                    container.innerHTML = students.length ? html : `<div class="text-center py-5 text-muted">No student innovators found matching "${query}".</div>`;
                    return;
                }

                // 6. Semantic Tab
                if (currentSerpCategory === "semantic") {
                    const projects = await API.request(`/search/semantic?q=${encodeURIComponent(query)}`);
                    document.getElementById("serpStatsText").innerText = `About ${projects.length} semantic vector matches`;
                    html = `<div class="serp-entity-grid">${projects.map(p => renderProjectCard(p)).join("")}</div>`;
                    container.innerHTML = projects.length ? html : `<div class="text-center py-5 text-muted">No semantic vector matches found.</div>`;
                    return;
                }

                // 7. ALL RESULTS (Grand Google SERP Layout)
                const [globalRes, projects, students] = await Promise.all([
                    API.request(`/search/global-live?q=${encodeURIComponent(query)}`).catch(() => ({})),
                    API.request(`/search/projects?q=${encodeURIComponent(query)}&sort_by=${sortBy}`).catch(() => []),
                    API.request(`/search/students?q=${encodeURIComponent(query)}`).catch(() => [])
                ]);

                const gResults = globalRes.googleWebResults || [];
                const ytResults = globalRes.youtubeResources || [];
                const repos = globalRes.githubRepositories || [];
                const totalCount = gResults.length + ytResults.length + projects.length + students.length + repos.length;

                document.getElementById("serpStatsText").innerText = `About ${totalCount} results retrieved live from internet & platform`;

                // Quick External Jump Chips
                html += `
                    <div class="d-flex flex-wrap align-items-center gap-2 mb-4 p-2 px-3 bg-light rounded-4 border">
                        <span class="small fw-semibold text-muted me-1"><i class="bi bi-arrow-up-right-square me-1"></i>Direct Search:</span>
                        <a href="https://www.google.com/search?q=${encodeURIComponent(query || 'student innovation')}" target="_blank" class="serp-sublink-chip">
                            <i class="bi bi-google text-primary"></i>Google Search
                        </a>
                        <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(query || 'student project demo')}" target="_blank" class="serp-sublink-chip">
                            <i class="bi bi-youtube text-danger"></i>YouTube Demos
                        </a>
                        <a href="https://github.com/search?q=${encodeURIComponent(query || 'student innovation')}" target="_blank" class="serp-sublink-chip">
                            <i class="bi bi-github text-dark"></i>GitHub
                        </a>
                    </div>
                `;

                // 1. Google Web Results Section
                if (gResults.length > 0) {
                    html += `
                        <div class="d-flex justify-content-between align-items-center mb-2 mt-2">
                            <h6 class="fw-bold text-dark mb-0"><i class="bi bi-google text-primary me-2"></i>Google Search Web Index</h6>
                            <button class="btn btn-sm btn-link text-decoration-none text-primary p-0 small" onclick="setSerpCategory('google', document.querySelectorAll('.serp-tab-btn')[1])">View all (${gResults.length})</button>
                        </div>
                    `;
                    html += gResults.slice(0, 4).map(w => renderGoogleSERPItem(w, query)).join("");
                }

                // 2. YouTube Video Demonstrations Section
                if (ytResults.length > 0) {
                    html += `
                        <div class="d-flex justify-content-between align-items-center mb-2 mt-4">
                            <h6 class="fw-bold text-dark mb-0"><i class="bi bi-youtube text-danger me-2"></i>YouTube Video Demonstrations</h6>
                            <button class="btn btn-sm btn-link text-decoration-none text-danger p-0 small" onclick="setSerpCategory('youtube', document.querySelectorAll('.serp-tab-btn')[2])">View all (${ytResults.length})</button>
                        </div>
                    `;
                    html += ytResults.slice(0, 2).map(y => renderYouTubeSERPItem(y, query)).join("");
                }

                // 3. Platform Verified Projects Section
                if (projects.length > 0) {
                    html += `
                        <div class="d-flex justify-content-between align-items-center mb-2 mt-4">
                            <h6 class="fw-bold text-dark mb-0"><i class="bi bi-code-slash text-success me-2"></i>DigiIndia Verified Projects</h6>
                            <button class="btn btn-sm btn-link text-decoration-none text-success p-0 small" onclick="setSerpCategory('projects', document.querySelectorAll('.serp-tab-btn')[3])">View all (${projects.length})</button>
                        </div>
                        <div class="serp-entity-grid">
                            ${projects.slice(0, 4).map(p => renderProjectCard(p)).join("")}
                        </div>
                    `;
                }

                // 4. Student Innovators Section
                if (students.length > 0) {
                    html += `
                        <div class="d-flex justify-content-between align-items-center mb-2 mt-4">
                            <h6 class="fw-bold text-dark mb-0"><i class="bi bi-people text-info me-2"></i>Verified Student Innovators</h6>
                            <button class="btn btn-sm btn-link text-decoration-none text-info p-0 small" onclick="setSerpCategory('students', document.querySelectorAll('.serp-tab-btn')[4])">View all (${students.length})</button>
                        </div>
                        <div class="serp-entity-grid">
                            ${students.slice(0, 3).map(s => renderStudentCard(s)).join("")}
                        </div>
                    `;
                }

                // 5. GitHub Repos Section
                if (repos.length > 0) {
                    html += `
                        <div class="d-flex justify-content-between align-items-center mb-2 mt-4">
                            <h6 class="fw-bold text-dark mb-0"><i class="bi bi-github text-dark me-2"></i>GitHub Open Source Repositories</h6>
                            <button class="btn btn-sm btn-link text-decoration-none text-dark p-0 small" onclick="setSerpCategory('github', document.querySelectorAll('.serp-tab-btn')[5])">View all (${repos.length})</button>
                        </div>
                        <div class="serp-entity-grid">
                            ${repos.slice(0, 4).map(r => renderGitHubRepoCard(r)).join("")}
                        </div>
                    `;
                }

                container.innerHTML = html;

            } catch (err) {
                container.innerHTML = `
                    <div class="alert alert-danger rounded-4 p-3 my-3">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>Search query failed: ${stripHtmlAndSanitize(err.message)}
                    </div>
                `;
            }
        }

        async function triggerDigiBot() {
            API.showToast("DigiBot crawler indexing live public repositories...", "info");
            try {
                const res = await API.request(`/search/digibot/crawl?query=${encodeURIComponent(currentSearchQuery || 'student project')}`, { method: "POST" });
                API.showToast(`DigiBot indexed ${res.indexedCount || 6} new repositories!`, "success");
                executeSerpSearch(currentSearchQuery);
            } catch(e) { API.showToast(e.message, "error"); }
        }

        async function handleSearchConnect(uid, btnEl) {
            let curState = btnEl.getAttribute("data-state") || "NONE";
            await NetworkActions.handleConnectClick(uid, curState, (newState) => {
                btnEl.setAttribute("data-state", newState);
                if (newState === "PENDING_SENT") {
                    btnEl.className = "btn btn-warning btn-sm rounded-pill text-dark px-3";
                    btnEl.innerHTML = `<i class="bi bi-clock me-1"></i>Pending`;
                } else if (newState === "CONNECTED") {
                    btnEl.className = "btn btn-outline-danger btn-sm rounded-pill px-3";
                    btnEl.innerHTML = `<i class="bi bi-person-dash me-1"></i>Disconnect`;
                } else {
                    btnEl.className = "btn btn-primary btn-sm rounded-pill px-3";
                    btnEl.innerHTML = `<i class="bi bi-person-plus me-1"></i>Connect`;
                }
            });
        }

        // Initialize on page load
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const queryParam = urlParams.get("q");
            if (queryParam && queryParam.trim().length > 0) {
                switchToSerpView(queryParam.trim());
            } else {
                document.getElementById("landingView").classList.remove("d-none");
                document.getElementById("serpView").classList.add("d-none");
                document.getElementById("serpHeaderNavCapsule").classList.add("d-none");
            }
        });
    </script>
</body>
