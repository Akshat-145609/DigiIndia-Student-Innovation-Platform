services:
  - type: web
    name: digiindia-platform
    env: python
    region: singapore
    plan: free
    rootDir: functions
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: its.akshatnetworkhub23@gmail.com
      - key: ADMIN_PASSWORD
        value: Admin@987
      - key: FIREBASE_PROJECT_ID
        value: digiindia-studentcollaboration
